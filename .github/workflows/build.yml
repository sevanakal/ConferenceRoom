# Her push ve PR'da: derle ve testleri çalıştır. MySQL testleri GitHub'ın verdiği MySQL konteynerinde çalışır.
name: Derleme ve test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - name: Paketleri indir
        run: dotnet restore

      - name: Kod biçimi denetimi
        run: dotnet format --verify-no-changes --no-restore

      - name: Derle
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release
        env:
          CONFERENCEROOM_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User=root;Password=test"
